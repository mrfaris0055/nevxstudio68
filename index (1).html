<style>/* ==========================================================
   NevXstudio - style.css
   1 Tokens | 2 Base | 3 Header | 4 Buttons | 5 Hero | 6 Sections
   7 Cards | 8 Product | 9 Cart | 10 Forms | 11 Footer | 12 Desktop
   Mobile first: base styles are for phones, @media at the end adds desktop.
   ========================================================== */

/* 1. TOKENS - change colours and fonts here */
:root{
  --black:#000; --ink:#0d0c0a; --panel:#16140f; --line:#2b271c;
  --gold:#c9a24b; --gold-hi:#e6c36e; --text:#ece6d8; --muted:#a39b86;
  --display:"Cormorant Garamond",Georgia,serif;
  --body:"Manrope",system-ui,sans-serif;
  --radius:4px;
}

/* 2. BASE */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--text);font:400 1rem/1.65 var(--body);-webkit-text-size-adjust:100%}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;letter-spacing:-.01em}
h1{font-size:2.6rem} h2{font-size:2rem} h3{font-size:1.45rem}
p{max-width:62ch}
.container{width:100%;max-width:1120px;margin:0 auto;padding:0 1.25rem}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 3. HEADER */
#site-header{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.offer-bar{background:var(--gold);color:#000;font-size:.82rem;font-weight:600;text-align:center;padding:.4rem 1rem}
.nav-wrap{display:flex;align-items:center;justify-content:space-between;min-height:62px}
.logo{font-family:var(--display);font-size:1.7rem;font-weight:700;letter-spacing:.01em}
.logo span{color:var(--gold)}
.burger{width:48px;height:48px;background:none;border:0;display:grid;place-content:center;gap:6px;cursor:pointer}
.burger span{width:24px;height:2px;background:var(--gold);transition:.3s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.nav{position:absolute;top:100%;left:0;right:0;background:var(--ink);border-bottom:1px solid var(--line);display:none;flex-direction:column;padding:.5rem 1.25rem 1rem}
.nav.open{display:flex}
.nav a{min-height:48px;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--line);transition:color .2s}
.nav a:hover,.nav a[aria-current]{color:var(--gold-hi)}
.cart-count{background:var(--gold);color:#000;border-radius:99px;font-size:.75rem;font-weight:700;min-width:22px;height:22px;display:inline-grid;place-items:center}

/* 4. BUTTONS (min 44px tall for thumbs) */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 1.6rem;background:var(--gold);color:#000;font:700 .95rem var(--body);border:1px solid var(--gold);border-radius:var(--radius);cursor:pointer;transition:background .25s,transform .25s,color .25s}
.btn:hover{background:var(--gold-hi);transform:translateY(-2px)}
.btn-line{background:transparent;color:var(--gold-hi)}
.btn-line:hover{background:var(--gold);color:#000}
.btn-sm{min-height:44px;padding:0 1rem;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.5rem}

/* 5. HERO - one big serif statement, a gold monogram behind it */
.hero{position:relative;overflow:hidden;padding:4rem 0 4.5rem;border-bottom:1px solid var(--line)}
.hero::before{content:"X";position:absolute;right:-1.5rem;top:-2rem;font:700 22rem/1 var(--display);color:transparent;-webkit-text-stroke:1px var(--line);pointer-events:none}
.hero h1{font-size:3.2rem;max-width:11ch;position:relative}
.hero p{margin-top:1.25rem;color:var(--muted);font-size:1.08rem;position:relative}
.hero .row{position:relative}
.hero-stats{display:flex;gap:2rem;margin-top:2.5rem;position:relative;color:var(--muted);font-size:.9rem}
.hero-stats b{display:block;font:600 1.8rem var(--display);color:var(--gold-hi)}

/* 6. SECTIONS */
.section{padding:3.5rem 0}
.section.alt{background:var(--ink);border-block:1px solid var(--line)}
.head{margin-bottom:2rem}
.head p{color:var(--muted);margin-top:.6rem}
.page-title{padding:2.5rem 0 1rem}
.why{display:grid;gap:1.5rem}
.why div{border-left:2px solid var(--gold);padding-left:1.1rem}
.why p{color:var(--muted);margin-top:.3rem}
.cta{text-align:center}
.cta p{margin:1rem auto 1.5rem}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.5rem}
.chip{min-height:44px;padding:0 1.2rem;background:none;color:var(--text);border:1px solid var(--line);border-radius:99px;font:600 .9rem var(--body);cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#000}

/* 7. CARDS */
.grid{display:grid;gap:1.25rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:border-color .3s,transform .3s}
.card:hover{border-color:var(--gold);transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:3/2;object-fit:cover}
.card-body{padding:1.25rem}
.card-body p{color:var(--muted);margin:.5rem 0 1rem;font-size:.95rem}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.tag{display:inline-block;color:var(--gold);font-size:.8rem;margin-bottom:.4rem}
.price{font:600 1.5rem var(--display);color:var(--gold-hi)}
.price small{display:block;font:400 .72rem var(--body);color:var(--muted)}
.price.big{font-size:2.2rem;margin:.6rem 0 1rem}

/* 8. PRODUCT DETAIL */
.product{display:grid;gap:2rem;padding:2rem 0 3.5rem}
.product img{border:1px solid var(--line);border-radius:var(--radius);width:100%}
.product h1{margin:.2rem 0}
.ticks{list-style:none;margin:1.2rem 0}
.ticks li{padding:.35rem 0 .35rem 1.6rem;position:relative}
.ticks li::before{content:"";position:absolute;left:0;top:.95rem;width:.8rem;height:2px;background:var(--gold)}

/* 9. CART */
.cart-wrap{display:grid;gap:2rem;padding-bottom:3.5rem}
.line{display:grid;grid-template-columns:90px 1fr;gap:.5rem 1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line)}
.line img{border-radius:var(--radius);aspect-ratio:3/2;object-fit:cover}
.line-info span{display:block;color:var(--muted);font-size:.9rem}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius);grid-column:1/3;width:max-content}
.qty button{width:44px;height:44px;background:none;color:var(--gold-hi);border:0;font-size:1.3rem;cursor:pointer}
.qty span{min-width:36px;text-align:center}
.line-total{color:var(--gold-hi)}
.rm{min-height:44px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit}
.rm:hover{color:#e07a6a}
.sum{display:flex;justify-content:space-between;font:600 1.6rem var(--display);padding:1rem 0}
.empty{padding:2rem 0;color:var(--muted)} .empty a{color:var(--gold-hi);text-decoration:underline}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem;margin-top:1.25rem}
.box h3{margin-bottom:.8rem}
.pay{list-style:none;display:grid;gap:.8rem;font-size:.92rem;color:var(--muted)}
.pay strong{color:var(--text)}
.qr{display:grid;place-items:center;width:160px;height:160px;margin-top:1rem;border:1px dashed var(--gold);color:var(--muted);font-size:.8rem;text-align:center}

/* 10. FORMS */
label{display:block;margin:1rem 0 .35rem;font-weight:600;font-size:.9rem}
input,textarea{width:100%;min-height:48px;background:var(--black);color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:.7rem .9rem;font:inherit;transition:border-color .2s}
input:focus,textarea:focus{outline:0;border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
form .btn{width:100%;margin-top:1.25rem}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--gold);color:#000;font-weight:700;padding:.8rem 1.4rem;border-radius:99px;z-index:100;animation:pop .3s}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}
.wa-float{position:fixed;right:1rem;bottom:1rem;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:60;transition:transform .25s}
.wa-float:hover{transform:scale(1.08)}
.about-text p{margin-bottom:1rem;color:var(--muted)}
.faq details{border-bottom:1px solid var(--line);padding:.2rem 0}
.faq summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600;list-style:none}
.faq summary::after{content:"+";margin-left:auto;color:var(--gold);font-size:1.4rem}
.faq details[open] summary::after{content:"-"}
.faq p{color:var(--muted);padding-bottom:1rem}

/* 11. FOOTER */
#site-footer{border-top:1px solid var(--line);padding-top:2.5rem;background:var(--ink)}
.foot-grid{display:grid;gap:1.75rem}
.foot-grid h4{font:700 .95rem var(--body);color:var(--gold);margin-bottom:.4rem}
.foot-grid a:not(.logo){display:block;min-height:36px;color:var(--muted)}
.foot-grid a:hover{color:var(--gold-hi)}
.foot-grid p{color:var(--muted);margin-top:.5rem;font-size:.92rem}
.copy{text-align:center;color:var(--muted);font-size:.82rem;padding:2rem 1rem 6rem}

/* 12. TABLET / DESKTOP */
@media (min-width:760px){
  h1{font-size:3.6rem} h2{font-size:2.5rem} .hero h1{font-size:5rem;max-width:12ch}
  .hero::before{font-size:36rem;right:2rem}
  .burger{display:none}
  .nav{position:static;display:flex;flex-direction:row;gap:1.75rem;padding:0;background:none;border:0}
  .nav a{border:0}
  .grid{grid-template-columns:repeat(2,1fr)}
  .why{grid-template-columns:repeat(3,1fr)}
  .product{grid-template-columns:1fr 1fr;align-items:start}
  .cart-wrap{grid-template-columns:1.4fr 1fr;align-items:start}
  .line{grid-template-columns:90px 1fr auto 90px auto}
  .qty{grid-column:auto}
  .foot-grid{grid-template-columns:2fr 1fr 1fr}
}
@media (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}

/* ---------- 1. HELPERS ---------- */
const money = n => SITE.currency + n.toLocaleString("en-US");
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const findProduct = id => PRODUCTS.find(p => p.id === Number(id));

/* ---------- 2. CART (saved in localStorage) ---------- */
function getCart() {
  try { return JSON.parse(localStorage.getItem("nx_cart")) || []; } catch (e) { return []; }
}
function saveCart(c) {
  try { localStorage.setItem("nx_cart", JSON.stringify(c)); } catch (e) {}
  updateCartCount();
}
function addToCart(id) {
  const cart = getCart(), item = cart.find(i => i.id === id);
  item ? item.qty++ : cart.push({ id, qty: 1 });
  saveCart(cart);
  toast("Added to your order");
}
function changeQty(id, d) {
  const cart = getCart(), item = cart.find(i => i.id === id);
  if (item) item.qty = Math.max(1, item.qty + d);
  saveCart(cart); renderCart();
}
function removeItem(id) {
  saveCart(getCart().filter(i => i.id !== id)); renderCart();
}
function cartTotal() {
  return getCart().reduce((t, i) => t + (findProduct(i.id)?.price || 0) * i.qty, 0);
}
function updateCartCount() {
  const n = getCart().reduce((t, i) => t + i.qty, 0);
  document.querySelectorAll(".cart-count").forEach(el => { el.textContent = n; el.hidden = n === 0; });
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ---------- 3. LAYOUT (header, offer bar, footer, WhatsApp button) ----------

function buildLayout() {

  const link = (href, label, key) => `<a href="${href}" ${page === key ? 'aria-current="page"' : ""}>${label}</a>`;
  const wa = `https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent("Hi NevXstudio, I'd like to discuss a project.")}`;
  $("#site-header").innerHTML = `

      <a class="logo" href="index.html" aria-label="NevXstudio home">Nev<span>X</span>studio</a>

        ${link("index.html", "Home", "home")}${link("shop.html", "Services", "shop")}

      </nav>
      <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>`;

        <p>Websites, ads, video and brands for businesses in Pakistan and around the world.</p></div>
      <div><h4>Pages</h4><a href="index.html">Home</a><a href="shop.html">Services</a><a href="about.html">About</a><a href="contact.html">Contact</a></div>

    </div>
    <p class="copy">&copy; ${new Date().getFullYear()} NevXstudio. All rights reserved.</p>`;
  const f = document.createElement("a");
  f.className = "wa-float"; f.href = wa; f.target = "_blank"; f.rel = "noopener";
  f.setAttribute("aria-label", "Chat on WhatsApp");
  f.innerHTML = `<svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path fill="#fff" d="M16 4C9.4 4 4 9 4 15.300c0 2.600 1 5 2.600 6.900L5 28l6-1.700c1.500.6 3.200.9 5 .9 6.600 0 12-5 12-11.300S22.600 4 16 4Z"/></svg>`;
  if(!document.querySelector('.wa-float'))document.body.appendChild(f);

/* ---------- 4. PAGES ---------- */
function card(p) {
  return `<article class="card">
    <a href="product.html?id=${p.id}"><img src="${p.image}" alt="${esc(p.name)} service by NevXstudio" loading="lazy" width="600" height="400"></a>
    <div class="card-body"><span class="tag">${esc(p.category)}</span>
      <h3><a href="product.html?id=${p.id}">${esc(p.name)}</a></h3>
      <p>${esc(p.short)}</p>
      <div class="card-foot"><span class="price"><small>Starting from</small> ${money(p.price)}</span>
        <button class="btn btn-sm" onclick="addToCart(${p.id})">Add to order</button></div></div></article>`;
}
function initHome() { $("#featured").innerHTML = PRODUCTS.slice(0, 3).map(card).join(""); }

function initShop() {
  const bar = $("#filters"), grid = $("#shop-grid");
  const cats = ["All", ...new Set(PRODUCTS.map(p => p.category))];
  bar.innerHTML = cats.map((c, i) => `<button class="chip ${i ? "" : "on"}" data-c="${c}">${c}</button>`).join("");
  const show = c => grid.innerHTML = PRODUCTS.filter(p => c === "All" || p.category === c).map(card).join("");
  bar.addEventListener("click", e => {
    if (!e.target.dataset.c) return;
    bar.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b === e.target));
    show(e.target.dataset.c);
  });
  show("All");
}

function initProduct() {
  const p = findProduct(new URLSearchParams(window.__q||"").get("id"));
  const box = $("#product");
  if (!p) { box.innerHTML = `<p>Service not found. <a href="shop.html">See all services</a></p>`; return; }
  document.title = `${p.name} | NevXstudio`;
  $('meta[name="description"]').content = p.short;
  box.innerHTML = `<img src="${p.image}" alt="${esc(p.name)} service by NevXstudio" width="600" height="400">
    <div><span class="tag">${esc(p.category)}</span><h1>${esc(p.name)}</h1>
    <p class="price big"><small>Starting from</small> ${money(p.price)}</p>
    <p>${esc(p.description)}</p>
    <ul class="ticks">${p.features.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
    <p class="muted">Delivery: ${esc(p.delivery)}</p>
    <div class="row"><button class="btn" onclick="addToCart(${p.id})">Add to order</button>
    <a class="btn btn-line" href="cart.html">View order</a></div></div>`;
}

/* ---------- 5. CART PAGE + CHECKOUT ---------- */
function renderCart() {
  const list = $("#cart-items"), cart = getCart();
  if (!cart.length) {
    list.innerHTML = `<p class="empty">Your order is empty. <a href="shop.html">Pick a service</a> to get started.</p>`;
    $("#cart-side").hidden = true; return;
  }
  $("#cart-side").hidden = false;
  list.innerHTML = cart.map(i => { const p = findProduct(i.id); if (!p) return "";
    return `<div class="line"><img src="${p.image}" alt="${esc(p.name)}" width="90" height="60">
      <div class="line-info"><strong>${esc(p.name)}</strong><span>${money(p.price)} each</span></div>
      <div class="qty"><button aria-label="Decrease quantity" onclick="changeQty(${p.id},-1)">-</button><span>${i.qty}</span>
        <button aria-label="Increase quantity" onclick="changeQty(${p.id},1)">+</button></div>
      <strong class="line-total">${money(p.price * i.qty)}</strong>
      <button class="rm" aria-label="Remove ${esc(p.name)}" onclick="removeItem(${p.id})">Remove</button></div>`; }).join("");
  $("#total").textContent = money(cartTotal());
}
function initCart() {
  renderCart();
  $("#pay-list").innerHTML = SITE.payments.map(([t, d]) => `<li><strong>${esc(t)}</strong><br>${esc(d)}</li>`).join("");
  $("#checkout").addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target, cart = getCart();
    if (!cart.length) return toast("Add a service first");
    const lines = cart.map(i => { const p = findProduct(i.id); return `- ${p.name} x${i.qty} = ${money(p.price * i.qty)}`; }).join("\n");
    const msg = `*New order - NevXstudio*\n\n${lines}\n\n*Total:* ${money(cartTotal())}\n\n*Name:* ${f.name.value}\n*Phone:* ${f.phone.value}\n*City/Country:* ${f.address.value}\n*Project notes:* ${f.notes.value || "-"}`;
    window.open(`https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent(msg)}`, "_blank");
  });
}
